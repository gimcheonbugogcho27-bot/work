name: Build Windows EXE

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --upgrade pip pyinstaller -r requirements.txt
      - name: Add private API key to this build
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python -c "import os; open('build_config.py','w',encoding='utf-8').write('DEFAULT_GEMINI_API_KEY = ' + repr(os.environ.get('GEMINI_API_KEY','')) + '\n')"
      - name: Build executable
        run: pyinstaller --noconfirm --clean --onefile --windowed --name TeacherToolkit app.py
      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: TeacherToolkit-Windows
          path: dist/TeacherToolkit.exe
          if-no-files-found: error
          retention-days: 30

